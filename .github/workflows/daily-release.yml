name: Daily release

on:
  schedule:
    # 17:30 Beijing time (UTC+8).
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build.yml
    with:
      daily: true
    secrets:
      ENV_REPO_TOKEN: ${{ secrets.ENV_REPO_TOKEN }}
